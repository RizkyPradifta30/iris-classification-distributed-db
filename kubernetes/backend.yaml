apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-backend
  namespace: iris-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris-backend
  template:
    metadata:
      labels:
        app: iris-backend
    spec:
      containers:
        - name: iris-backend
          image: iris-classification-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          env:
            # Database credentials from Kubernetes Secret
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iris-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iris-db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: iris-db-secret
                  key: POSTGRES_DB

            # Application configuration from ConfigMap
            - name: PRIMARY_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: iris-backend-config
                  key: PRIMARY_DB_HOST

            - name: REPLICA_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: iris-backend-config
                  key: REPLICA_DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: iris-backend-config
                  key: DB_PORT

            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: iris-backend-config
                  key: KEYCLOAK_URL

            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: iris-backend-config
                  key: KEYCLOAK_REALM

            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: iris-backend-config
                  key: KEYCLOAK_CLIENT_ID

            - name: KEYCLOAK_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: iris-backend-config
                  key: KEYCLOAK_JWKS_URL

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: iris-backend
  namespace: iris-system
spec:
  type: NodePort
  selector:
    app: iris-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080