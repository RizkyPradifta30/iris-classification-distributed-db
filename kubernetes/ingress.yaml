apiVersion: v1
kind: Service
metadata:
  name: keycloak-external
  namespace: iris-system
spec:
  type: ExternalName
  externalName: host.minikube.internal
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iris-ingress
  namespace: iris-system
spec:
  ingressClassName: nginx
  rules:
    - host: api.lokal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iris-backend
                port:
                  number: 8000
    - host: auth.lokal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-external
                port:
                  number: 8080